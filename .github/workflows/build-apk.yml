
name: Build ZapretDroid APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use compatible Gradle version
        run: |
          sed -i 's/gradle-9\.0\.0-bin\.zip/gradle-8.9-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapretDroid-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
